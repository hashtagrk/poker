name: AlpinePoker
options:
  bundleIdPrefix: com.hashtagrk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AlpinePoker:
    type: application
    platform: iOS
    sources: [AlpinePoker]
    info:
      path: AlpinePoker/Info.plist
      properties:
        CFBundleDisplayName: Alpine Poker
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        # same id as the earlier web-view app, so this replaces it and inherits its saved games
        PRODUCT_BUNDLE_IDENTIFIER: com.hashtagrk.alpinepoker
        PRODUCT_NAME: AlpinePoker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  AlpinePokerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AlpinePokerTests]
    dependencies:
      - target: AlpinePoker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashtagrk.alpinepoker.tests
        GENERATE_INFOPLIST_FILE: YES
  AlpinePokerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AlpinePokerUITests]
    dependencies:
      - target: AlpinePoker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hashtagrk.alpinepoker.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AlpinePoker
schemes:
  AlpinePoker:
    build:
      targets:
        AlpinePoker: all
        AlpinePokerTests: [test]
        AlpinePokerUITests: [test]
    test:
      targets: [AlpinePokerTests, AlpinePokerUITests]
